# Gd and Pb (70 wt%) in C2H4 (30 wt%) at 100 kV, 10 thicknesses: 20 simulations.
# Same design as examples/03_gd_pb_sweep.py.
#
#   attenupy prepare runs/gd_pb --design examples/gd_pb_sweep.toml --dry-run
#   attenupy prepare runs/gd_pb --design examples/gd_pb_sweep.toml

[[design]]
type = "sweep"
beams = ["RQR8_100"]
thicknesses_mm = { start = 0.15, stop = 1.5, step = 0.15 }
mixtures = [
  { fractions = { Gd = 0.70 }, polymer_fraction = 0.30 },
  { fractions = { Pb = 0.70 }, polymer_fraction = 0.30 },
]
