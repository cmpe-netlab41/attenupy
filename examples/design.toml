# attenupy design file:  attenupy prepare runs/paper --design examples/design.toml
# (add --dry-run first to see what would be created)

# Constituents beyond the built-in ones (Bi2O3 BaSO4 BN B4C WO3 Sb Sn Bi W Cu B Ba Pb Gd).
[constituents]
Gd2O3 = 7.41

# Beams beyond the paper's five (N30_030, RQR5_070, RQR6_080, RQR8_100, x120kV).
# [[beams]]
# key = "W60"
# kvp = 60
# spectrum = "spectra/W60.spc"      # relative to this file
#
# ...or computed with SpekPy (pip install spekpy); kvp is taken from the beam:
# [[beams]]
# key = "RQR5_spekpy"
# kvp = 70
# folder = "70kV_spekpy"
# spectrum = { type = "spekpy", th = 12, filters = [["Al", 2.8], ["Be", 3.0]], dk = 1.0 }

# 1) Training set: 300 random composites per beam, one random thickness each.
[[design]]
type = "random"
n = 300
beams = ["RQR6_080", "RQR8_100", "x120kV"]
constituents = ["Bi2O3", "BaSO4", "BN", "B4C", "WO3", "Sb", "Sn", "Bi", "W", "Cu", "B", "Ba"]
n_constituents = [1, 2, 3]            # or { 2 = 0.7, 3 = 0.3 }
polymer_fractions = [0.20, 0.30, 0.40]
thicknesses_mm = { start = 0.15, stop = 1.5, step = 0.15 }
seed = 0
# splitter = { type = "dirichlet", alpha = { B = 2.5, Ba = 2.5 }, min_share = 0.1 }
# require_any = ["B", "Ba"]

# 2) Held-out curve: one composition at every thickness.
[[design]]
type = "sweep"
beams = ["RQR6_080"]
thicknesses_mm = { start = 0.15, stop = 1.5, step = 0.15 }
mixtures = [ { fractions = { Bi2O3 = 0.40, BaSO4 = 0.20 }, polymer_fraction = 0.40 } ]

# 3) Six random compositions, each swept over the thickness list.
[[design]]
type = "sweep"
beams = ["RQR8_100"]
thicknesses_mm = [0.15, 0.30, 0.45, 0.60, 0.75, 0.90, 1.05, 1.20, 1.35, 1.50]
mixtures = { n = 6, seed = 1, random = { constituents = ["Bi", "W", "Sn", "Gd2O3"], n_constituents = 2 } }
